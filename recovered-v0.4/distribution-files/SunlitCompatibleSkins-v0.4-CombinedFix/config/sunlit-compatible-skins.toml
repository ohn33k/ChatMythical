# Sunlit Compatible Skins server configuration.
# Changes reload automatically within about 30 seconds.

[appearance_spawning]
# Assign a valid appearance to naturally created wild Pokemon.
enabled = true
# The remaining percentage is divided evenly among valid enabled appearances.
normal_chance_percent = 50.0
legendary_normal_chance_percent = 50.0
include_texture_variants = true
include_shader_effects = true
# Comma-separated names such as blazing,twilight,galaxy, or * for everything.
enabled_variant_families = "*"

[legendary_spawning]
enabled = true
# The timer advances only while at least one player is online.
minimum_online_minutes = 60
maximum_online_minutes = 240
check_interval_minutes = 5
initial_check_chance_percent = 2.0
maximum_check_chance_percent = 25.0
announce_spawns = true
include_nearby_player_name = true
include_coordinates = false
level_min = 50
level_max = 70

[legendary_species_weights]
# Optional relative weights. Zero disables a species.
# Native supported scheduler species: articuno, ironleaves, mew, mewtwo,
# moltres, rayquaza, walkingwake, xerneas, and zapdos.
# mew = 0.25
# moltres = 1.0
